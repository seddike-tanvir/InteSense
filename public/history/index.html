<!DOCTYPE html>
<html lang="bn" id="htmlRoot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intesense - ইতিহাস</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.maateen.me/siyam-rupali/font.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    :root { --bg-body: #f1f5f9; --bg-card: #ffffff; --bg-header: rgba(255,255,255,0.85); --text-primary: #1e293b; --text-secondary: #475569; --border-color: #e2e8f0; --shadow: 0 4px 6px -1px rgba(0,0,0,0.07); --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08); --nav-bg: #f8fafc; }
    .dark { --bg-body: #0f172a; --bg-card: #1e293b; --bg-header: rgba(30,41,59,0.9); --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border-color: #334155; --shadow: 0 4px 6px -1px rgba(0,0,0,0.5); --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.6); --nav-bg: #1e293b; }
    * { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; }
    body { font-family: 'Siyam Rupali', 'Noto Serif Bengali', serif; background: var(--bg-body); color: var(--text-primary); min-height: 100vh; }
    .lang-en body { font-family: 'Poppins', sans-serif; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: var(--shadow); border-radius: 16px; }
    .header-card { background: var(--bg-header); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); }
    .nav-link { background: var(--nav-bg); color: var(--text-secondary); border: 1px solid var(--border-color); transition: all 0.2s; }
    .nav-link.active { background: #4f46e5; color: white; border-color: #4f46e5; }
    .nav-link:hover:not(.active) { background: var(--border-color); }
    .toggle-checkbox:checked + .toggle-label { background-color: #4f46e5; }
    .toggle-checkbox:checked + .toggle-label .toggle-dot { transform: translateX(100%); background-color: white; }
    .toggle-label { display: flex; align-items: center; justify-content: space-between; width: 52px; height: 28px; padding: 3px; border-radius: 9999px; background-color: #cbd5e1; cursor: pointer; transition: background-color 0.2s; position: relative; }
    .toggle-dot { width: 22px; height: 22px; border-radius: 9999px; background-color: white; transition: transform 0.2s; position: absolute; left: 3px; top: 3px; }
    .dark .toggle-label { background-color: #475569; }
    .lang-btn { background: var(--nav-bg); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 6px 14px; border-radius: 9999px; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .lang-btn:hover { background: var(--border-color); }
    .lang-btn.active-lang { background: #4f46e5; color: white; border-color: #4f46e5; }
    .logout-btn { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 9999px; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .logout-btn:hover { background: #dc2626; transform: scale(1.02); }
    .footer-link { color: var(--text-secondary); text-decoration: underline; text-underline-offset: 2px; transition: color 0.2s; }
    .footer-link:hover { color: #4f46e5; }
    .dark .footer-link:hover { color: #818cf8; }
    #tableContainer::-webkit-scrollbar { width: 4px; }
    #tableContainer::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 8px; }
  </style>
</head>
<body>

  <!-- ===== হেডার ===== -->
  <div class="header-card sticky top-0 z-40">
    <div class="container mx-auto px-4 py-3 max-w-7xl flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="text-2xl md:text-3xl font-bold text-indigo-700 dark:text-indigo-400 tracking-tight">Intesense</span>
        <span id="statusBadge" class="text-xs bg-green-500 text-white px-3 py-1 rounded-full">🟢 Online</span>
      </div>
      <div class="flex items-center gap-3 flex-wrap">
        <div class="flex gap-1 text-sm font-medium">
          <a href="/" class="nav-link px-3 py-1.5 rounded-full transition">📊 <span data-i18n="nav_dashboard">ড্যাশবোর্ড</span></a>
          <a href="../history/" class="nav-link active px-3 py-1.5 rounded-full transition">📜 <span data-i18n="nav_history">ইতিহাস</span></a>
          <a href="../settings/" class="nav-link px-3 py-1.5 rounded-full transition">⚙️ <span data-i18n="nav_settings">সেটিংস</span></a>
        </div>
        <div class="flex items-center gap-1 border-l border-gray-300 dark:border-gray-700 pl-3">
          <button id="langBn" class="lang-btn active-lang" data-lang="bn">বাং</button>
          <button id="langEn" class="lang-btn" data-lang="en">EN</button>
        </div>
        <div class="flex items-center gap-1 ml-1">
          <span class="text-sm text-gray-500 dark:text-gray-400">☀️</span>
          <input type="checkbox" id="themeToggle" class="toggle-checkbox hidden" />
          <label for="themeToggle" class="toggle-label relative"><span class="toggle-dot"></span></label>
          <span class="text-sm text-gray-500 dark:text-gray-400">🌙</span>
        </div>
        <button onclick="logout()" class="logout-btn">🚪 <span data-i18n="logout">প্রস্থান</span></button>
      </div>
    </div>
  </div>

  <!-- ===== প্রধান কন্টেইনার ===== -->
  <div class="container mx-auto px-4 py-6 max-w-7xl">

    <!-- ফিল্টার -->
    <div class="card p-4 mb-6 flex flex-wrap items-end gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300" data-i18n="filter_range">ফিল্টার রেঞ্জ</label>
        <select id="filterRange" class="mt-1 p-2 border border-gray-300 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200">
          <option value="1h" data-i18n="filter_1h">গত ১ ঘন্টা</option>
          <option value="6h" selected data-i18n="filter_6h">গত ৬ ঘন্টা</option>
          <option value="24h" data-i18n="filter_24h">গত ২৪ ঘন্টা</option>
          <option value="7d" data-i18n="filter_7d">গত ৭ দিন</option>
          <option value="all" data-i18n="filter_all">সব</option>
        </select>
      </div>
      <button onclick="loadHistory()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition" data-i18n="load_btn">🔍 লোড করুন</button>
      <span id="recordCount" class="text-sm text-gray-500 dark:text-gray-400 ml-auto"></span>
    </div>

    <!-- চার্ট -->
    <div class="card p-4 mb-6">
      <h3 class="font-semibold mb-2 text-gray-700 dark:text-gray-300" data-i18n="history_chart">📈 ঐতিহাসিক ডাটা</h3>
      <canvas id="historyChart" height="200"></canvas>
    </div>

    <!-- টেবিল -->
    <div class="card p-4 overflow-x-auto">
      <h3 class="font-semibold mb-2 text-gray-700 dark:text-gray-300" data-i18n="history_table">📋 বিস্তারিত তালিকা</h3>
      <div id="tableContainer" class="max-h-96 overflow-y-auto">
        <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700 text-sm">
          <thead class="bg-gray-50 dark:bg-gray-800 sticky top-0">
            <tr>
              <th class="px-4 py-2 text-left" data-i18n="th_time">সময়</th>
              <th class="px-4 py-2 text-left" data-i18n="th_temp">🌡️ তাপমাত্রা</th>
              <th class="px-4 py-2 text-left" data-i18n="th_humidity">💧 আর্দ্রতা</th>
              <th class="px-4 py-2 text-left" data-i18n="th_smoke">🔥 ধোঁয়া</th>
              <th class="px-4 py-2 text-left" data-i18n="th_flame">🔥 শিখা</th>
              <th class="px-4 py-2 text-left" data-i18n="th_motion">🚶 গতি</th>
              <th class="px-4 py-2 text-left" data-i18n="th_alarm">🚨 অ্যালার্ম</th>
            </tr>
          </thead>
          <tbody id="historyTableBody" class="bg-white dark:bg-gray-900 divide-y divide-gray-200 dark:divide-gray-800"></tbody>
        </table>
      </div>
    </div>

    <!-- ফুটার -->
    <div class="text-center text-xs text-gray-400 dark:text-gray-600 py-6 border-t border-gray-200 dark:border-gray-800 mt-8 space-y-1">
      <div data-i18n="footer"></div>
      <div data-i18n="license"></div>
    </div>
  </div>

  <!-- ========================================================= -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA8WKGXIAioDQ14Q_z1XpaJvCUkTvBD6_I",
      authDomain: "intesense-ae5aa.firebaseapp.com",
      databaseURL: "https://intesense-ae5aa-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "intesense-ae5aa",
      storageBucket: "intesense-ae5aa.firebasestorage.app",
      messagingSenderId: "945696306096",
      appId: "1:945696306096:web:571d1726277182b0f35c75",
      measurementId: "G-H9VJCRJWD2"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // ===== অথেনটিকেশন =====
    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = '/login/';
      }
    });

    function logout() {
      auth.signOut().then(() => {
        window.location.href = '/login/';
      });
    }

    // ===== ল্যাঙ্গুয়েজ =====
    const translations = {
      bn: {
        nav_dashboard: 'ড্যাশবোর্ড', nav_history: 'ইতিহাস', nav_settings: 'সেটিংস',
        logout: 'প্রস্থান', filter_range: 'ফিল্টার রেঞ্জ', filter_1h: 'গত ১ ঘন্টা',
        filter_6h: 'গত ৬ ঘন্টা', filter_24h: 'গত ২৪ ঘন্টা', filter_7d: 'গত ৭ দিন',
        filter_all: 'সব', load_btn: '🔍 লোড করুন', history_chart: '📈 ঐতিহাসিক ডাটা',
        history_table: '📋 বিস্তারিত তালিকা', th_time: 'সময়', th_temp: '🌡️ তাপমাত্রা',
        th_humidity: '💧 আর্দ্রতা', th_smoke: '🔥 ধোঁয়া', th_flame: '🔥 শিখা',
        th_motion: '🚶 গতি', th_alarm: '🚨 অ্যালার্ম', no_data: 'কোনো ডাটা নেই',
        footer: '© ২০২৬ ইন্টেসেন্স · <a href="https://tanvirseddike.web.app/" target="_blank" rel="noopener noreferrer" class="footer-link">তানভীর সিদ্দিকী</a> কর্তৃক সর্বস্বত্ব সংরক্ষিত।',
        license: 'লাইসেন্স: GPL সংস্করণ ৩'
      },
      en: {
        nav_dashboard: 'Dashboard', nav_history: 'History', nav_settings: 'Settings',
        logout: 'Logout', filter_range: 'Filter Range', filter_1h: 'Last 1 hour',
        filter_6h: 'Last 6 hours', filter_24h: 'Last 24 hours', filter_7d: 'Last 7 days',
        filter_all: 'All', load_btn: '🔍 Load', history_chart: '📈 Historical Data',
        history_table: '📋 Detailed List', th_time: 'Time', th_temp: '🌡️ Temperature',
        th_humidity: '💧 Humidity', th_smoke: '🔥 Smoke', th_flame: '🔥 Flame',
        th_motion: '🚶 Motion', th_alarm: '🚨 Alarm', no_data: 'No data available',
        footer: '© 2026 InteSense · All rights reserved by <a href="https://tanvirseddike.web.app/" target="_blank" rel="noopener noreferrer" class="footer-link">Tanvir Seddike</a>',
        license: 'Licensed under GPL v3'
      }
    };

    let currentLang = localStorage.getItem('lang') || 'bn';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.documentElement.lang = lang === 'bn' ? 'bn' : 'en';
      document.body.classList.toggle('lang-en', lang === 'en');
      document.getElementById('langBn').classList.toggle('active-lang', lang === 'bn');
      document.getElementById('langEn').classList.toggle('active-lang', lang === 'en');
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.innerHTML = translations[lang][key];
        }
      });
    }
    setLanguage(currentLang);
    document.getElementById('langBn').addEventListener('click', () => setLanguage('bn'));
    document.getElementById('langEn').addEventListener('click', () => setLanguage('en'));

    // ===== থিম =====
    const htmlRoot = document.getElementById('htmlRoot');
    const themeToggle = document.getElementById('themeToggle');

    function setTheme(dark) {
      if (dark) { htmlRoot.classList.add('dark'); themeToggle.checked = true; localStorage.setItem('theme', 'dark'); }
      else { htmlRoot.classList.remove('dark'); themeToggle.checked = false; localStorage.setItem('theme', 'light'); }
    }
    if (localStorage.getItem('theme') === 'dark') setTheme(true);
    else setTheme(false);
    themeToggle.addEventListener('change', function() { setTheme(this.checked); });

    // ===== ইতিহাস লোড =====
    let chartInstance = null;

    function getTimeFilter() {
      const val = document.getElementById('filterRange').value;
      const now = Date.now();
      const ms = { '1h': 3600000, '6h': 21600000, '24h': 86400000, '7d': 604800000 };
      if (val === 'all') return 0;
      return now - (ms[val] || 0);
    }

    function loadHistory() {
      const minTime = getTimeFilter();
      db.ref('/history').once('value').then(snap => {
        const data = snap.val();
        if (!data) {
          document.getElementById('historyTableBody').innerHTML =
            `<tr><td colspan="7" class="text-center py-4 text-gray-400">${translations[currentLang].no_data}</td></tr>`;
          document.getElementById('recordCount').textContent = '';
          return;
        }
        const keys = Object.keys(data).sort((a, b) => a.localeCompare(b));
        const filtered = keys.filter(k => {
          const ts = data[k].timestamp || 0;
          return minTime === 0 || ts >= minTime;
        });

        document.getElementById('recordCount').textContent =
          `${translations[currentLang].filter_all === 'All' ? 'Total' : 'মোট'} ${filtered.length} ${translations[currentLang].filter_all === 'All' ? 'records' : 'টি রেকর্ড'}`;

        const tbody = document.getElementById('historyTableBody');
        tbody.innerHTML = filtered.map(k => {
          const d = data[k];
          const time = new Date(d.timestamp).toLocaleString(currentLang === 'bn' ? 'bn-BD' : 'en-US');
          return `<tr>
            <td class="px-4 py-2 whitespace-nowrap">${time}</td>
            <td class="px-4 py-2">${d.temperature?.toFixed(1) ?? '--'}</td>
            <td class="px-4 py-2">${d.humidity?.toFixed(1) ?? '--'}</td>
            <td class="px-4 py-2">${d.smoke ?? '--'}</td>
            <td class="px-4 py-2">${d.flame ? '🔥 হ্যাঁ' : '✅ না'}</td>
            <td class="px-4 py-2">${d.motion ? '🚶 হ্যাঁ' : '⏸️ না'}</td>
            <td class="px-4 py-2 ${d.alarm ? 'text-red-600 font-bold' : 'text-green-600'}">${d.alarm ? '🚨 অ্যালার্ম' : '✅ স্বাভাবিক'}</td>
          </tr>`;
        }).join('');

        const labels = filtered.map(k => new Date(data[k].timestamp).toLocaleString(currentLang === 'bn' ? 'bn-BD' : 'en-US'));
        const tempData = filtered.map(k => data[k].temperature || 0);
        const humData = filtered.map(k => data[k].humidity || 0);
        const smokeData = filtered.map(k => data[k].smoke || 0);

        if (chartInstance) chartInstance.destroy();
        const ctx = document.getElementById('historyChart').getContext('2d');
        chartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              { label: currentLang === 'bn' ? 'তাপমাত্রা (°C)' : 'Temperature (°C)', data: tempData, borderColor: '#ef4444', yAxisID: 'y1' },
              { label: currentLang === 'bn' ? 'আর্দ্রতা (%)' : 'Humidity (%)', data: humData, borderColor: '#3b82f6', yAxisID: 'y2' },
              { label: currentLang === 'bn' ? 'ধোঁয়া (ADC)' : 'Smoke (ADC)', data: smokeData, borderColor: '#f59e0b', yAxisID: 'y1' }
            ]
          },
          options: {
            responsive: true,
            plugins: { legend: { position: 'top' } },
            scales: {
              y1: { beginAtZero: true, position: 'left' },
              y2: { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false } }
            }
          }
        });
      }).catch(err => console.error(err));
    }

    window.onload = function() {
      loadHistory();
      document.getElementById('filterRange').addEventListener('change', loadHistory);
    };
  </script>
</body>
</html>
